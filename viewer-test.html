<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Radiograph Cloud Viewer Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f5f8;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.08);
    }

    input,
    button {
      padding: 11px;
      margin: 6px 0;
      font-size: 16px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      margin-right: 8px;
    }

    #viewer {
      display: none;
    }

    #radiographImage {
      display: block;
      max-width: 100%;
      max-height: 650px;
      object-fit: contain;
      margin: 20px auto;
      background: black;
    }

    #status {
      white-space: pre-line;
      margin-top: 15px;
    }

    #imageInfo {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 10px;
    }
  </style>
</head>

<body>

  <div class="card" id="loginCard">

    <h2>Observer Login</h2>

    <label>Evaluator ID</label>
    <input
      id="evaluatorId"
      type="text"
      placeholder="E01"
    />

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
    />

    <button id="loginBtn">
      Sign In
    </button>

    <div id="status">
      Not signed in.
    </div>

  </div>


  <div class="card" id="viewer">

    <h2>Cloud Radiograph Viewer</h2>

    <div id="loggedInEvaluator"></div>

    <div id="imageInfo">
      Loading...
    </div>

    <img
      id="radiographImage"
      alt="Panoramic radiograph"
    />

    <div style="text-align:center;">

      <button id="prevBtn">
        Previous
      </button>

      <button id="nextBtn">
        Next
      </button>

      <input
        id="jumpInput"
        type="number"
        min="1"
        max="1000"
        placeholder="Image number"
        style="width:150px;"
      />

      <button id="jumpBtn">
        Jump
      </button>

      <button id="logoutBtn">
        Sign Out
      </button>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>


  <script>

    /*
      REPLACE these with the exact same emails
      that worked in auth-test.html
    */

    const EVALUATOR_EMAILS = {
      E01: "observer01@impactedthirdmolar.com",
      E02: "observer02@impactedthirdmolar.com",
      E03: "observer03@impactedthirdmolar.com"
    };


    let radiographs = [];
    let currentIndex = 0;
    let currentEvaluatorId = "";


    const evaluatorInput =
      document.getElementById("evaluatorId");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const status =
      document.getElementById("status");

    const loginCard =
      document.getElementById("loginCard");

    const viewer =
      document.getElementById("viewer");

    const radiographImage =
      document.getElementById("radiographImage");

    const imageInfo =
      document.getElementById("imageInfo");

    const loggedInEvaluator =
      document.getElementById("loggedInEvaluator");



    loginBtn.addEventListener(
      "click",
      login
    );


    passwordInput.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


    document.getElementById("prevBtn")
      .addEventListener(
        "click",
        previousImage
      );


    document.getElementById("nextBtn")
      .addEventListener(
        "click",
        nextImage
      );


    document.getElementById("jumpBtn")
      .addEventListener(
        "click",
        jumpToImage
      );


    document.getElementById("logoutBtn")
      .addEventListener(
        "click",
        logout
      );



    async function login() {

      const evaluatorId =
        evaluatorInput.value
          .trim()
          .toUpperCase();

      const password =
        passwordInput.value;


      if (!EVALUATOR_EMAILS[evaluatorId]) {

        status.textContent =
          "Invalid Evaluator ID.";

        return;
      }


      if (!password) {

        status.textContent =
          "Please enter password.";

        return;
      }


      status.textContent =
        "Signing in...";


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email:
              EVALUATOR_EMAILS[evaluatorId],

            password:
              password

          });


      if (error) {

        status.textContent =
          "Sign in failed:\n" +
          error.message;

        return;
      }


      const user =
        data.user;


      const {
        data: evaluatorRecord,
        error: evaluatorError
      } =
        await supabaseClient
          .from("evaluators")
          .select("evaluator_id")
          .eq("user_id", user.id)
          .single();


      if (
        evaluatorError ||
        !evaluatorRecord
      ) {

        await supabaseClient.auth
          .signOut();

        status.textContent =
          "Evaluator identity verification failed.";

        return;
      }


      if (
        evaluatorRecord.evaluator_id
        !== evaluatorId
      ) {

        await supabaseClient.auth
          .signOut();

        status.textContent =
          "Evaluator ID does not match this account.";

        return;
      }


      currentEvaluatorId =
        evaluatorRecord.evaluator_id;


      status.textContent =
        "Loading radiograph dataset...";


      await loadDataset();
    }



    async function loadDataset() {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("radiographs")
          .select(
            "id,image_order,image_id,file_name,storage_path"
          )
          .order(
            "image_order",
            { ascending: true }
          )
          .range(0, 999);


      if (error) {

        status.textContent =
          "Cannot load radiograph table:\n" +
          error.message;

        return;
      }


      radiographs =
        data || [];


      if (
        radiographs.length !== 1000
      ) {

        status.textContent =
          "Dataset error.\nExpected 1000 radiographs but received " +
          radiographs.length +
          ".";

        return;
      }


      currentIndex = 0;


      loginCard.style.display =
        "none";

      viewer.style.display =
        "block";


      loggedInEvaluator.textContent =
        "Evaluator: " +
        currentEvaluatorId;


      await showCurrentImage();
    }



    async function showCurrentImage() {

      if (
        !radiographs.length
      ) {
        return;
      }


      const record =
        radiographs[currentIndex];


      imageInfo.textContent =
        "Loading " +
        record.image_id +
        "...";


      radiographImage.removeAttribute(
        "src"
      );


      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from("radiographs")
          .createSignedUrl(
            record.storage_path,
            3600
          );


      if (error) {

        imageInfo.textContent =
          "Cannot load image: " +
          record.image_id;

        alert(
          "Storage error:\n" +
          error.message +
          "\n\nPath:\n" +
          record.storage_path
        );

        return;
      }


      radiographImage.src =
        data.signedUrl;


      imageInfo.textContent =
        "Image " +
        (currentIndex + 1) +
        " of " +
        radiographs.length +
        " | " +
        record.image_id;
    }



    async function previousImage() {

      if (
        currentIndex <= 0
      ) {
        return;
      }


      currentIndex -= 1;

      await showCurrentImage();
    }



    async function nextImage() {

      if (
        currentIndex >=
        radiographs.length - 1
      ) {
        return;
      }


      currentIndex += 1;

      await showCurrentImage();
    }



    async function jumpToImage() {

      const imageNumber =
        Number(
          document.getElementById(
            "jumpInput"
          ).value
        );


      if (
        !Number.isInteger(imageNumber) ||
        imageNumber < 1 ||
        imageNumber >
          radiographs.length
      ) {

        alert(
          "Enter an image number between 1 and " +
          radiographs.length +
          "."
        );

        return;
      }


      currentIndex =
        imageNumber - 1;


      await showCurrentImage();
    }



    async function logout() {

      await supabaseClient.auth
        .signOut();


      radiographs = [];

      currentIndex = 0;

      currentEvaluatorId = "";


      radiographImage.removeAttribute(
        "src"
      );


      viewer.style.display =
        "none";

      loginCard.style.display =
        "block";

      passwordInput.value =
        "";

      status.textContent =
        "Signed out.";
    }


  </script>

</body>
</html>
